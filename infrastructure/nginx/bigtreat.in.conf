# ─── Rate limiting zones (define in http block of nginx.conf) ─────────────────
# Add to /etc/nginx/nginx.conf inside http {}:
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → HTTPS redirect (all traffic)
server {
    listen 80;
    server_name bigtreat.in www.bigtreat.in;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name bigtreat.in www.bigtreat.in;

    # TLS — obtain with: certbot --nginx -d bigtreat.in -d www.bigtreat.in
    ssl_certificate     /etc/letsencrypt/live/bigtreat.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bigtreat.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Hide nginx version from Server header
    server_tokens off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # ─────────────────────────────────────────────────────────────────────────

    # Frontend - React App
    location / {
        root /var/www/bigteam/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend auth routes — strict rate limit (5 req/min per IP)
    location /auth {
        limit_req zone=auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Backend API routes — general rate limit (30 req/s per IP)
    location /api {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /var/www/bigteam/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
